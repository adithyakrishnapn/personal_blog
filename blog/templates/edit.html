<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - Personal Blog</title>
    <!-- Google Fonts for premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="container header-content">
                <a href="{% url 'home' %}" class="logo">
                    <span class="logo-text">MySpace</span>
                </a>
                <nav class="main-nav">
                    <ul>
                        <li><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                        <li><a href="{% url 'add_blog' %}" class="nav-link btn-primary">New Post</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="main-content container">
            <div class="form-wrapper">
                <div class="form-card">
                    <div class="form-header-group">
                        <h2 class="form-title">Edit Post</h2>
                        <a href="{% url 'delete_blog' blog.id %}" class="btn-danger-outline btn-sm">Delete Post</a>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" name="title" value="{{ blog.title }}" class="form-input"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="content" class="form-label">Content</label>
                            <textarea id="content" name="content" rows="12" class="form-textarea"
                                required>{{ blog.content }}</textarea>
                        </div>
                        <div class="form-actions">
                            <input type="submit" value="Update Blog" class="btn-primary full-width">
                        </div>
                    </form>

                    {% if message %}
                    <div class="alert-inline info">
                        {{ message }}
                    </div>
                    <script>
                        setTimeout(function () {
                            window.location.href = "{% url 'home' %}";
                        }, 2000);
                    </script>
                    {% endif %}
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="container">
                <p>&copy; {% now "Y" %} Personal Blog. Crafted by Adithya.</p>
            </div>
        </footer>
    </div>
</body>

</html>
