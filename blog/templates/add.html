<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog - Personal Blog</title>
    <!-- Google Fonts for premium feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="container header-content">
                <a href="{% url 'home' %}" class="logo">
                    <span class="logo-text">MySpace</span>
                </a>
                <nav class="main-nav">
                    <ul>
                        <li><a href="{% url 'home' %}" class="nav-link">Home</a></li>
                        <li><a href="{% url 'add_blog' %}" class="nav-link btn-primary">New Post</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="main-content container">
            <div class="form-wrapper">
                <div class="form-card">
                    <h2 class="form-title">Create New Post</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" name="title" class="form-input" required
                                placeholder="Enter an engaging title...">
                        </div>
                        <div class="form-group">
                            <label for="content" class="form-label">Content</label>
                            <textarea id="content" name="content" rows="12" class="form-textarea" required
                                placeholder="Write your story here..."></textarea>
                        </div>
                        <div class="form-actions">
                            <input type="submit" value="Publish Post" class="btn-primary full-width">
                        </div>
                    </form>

                    {% if message %}
                    <script>
                        alert("{{ message }}");
                        setTimeout(function () {
                            window.location.href = "{% url 'home' %}";
                        }, 1000);
                    </script>
                    {% endif %}
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="container">
                <p>&copy; {% now "Y" %} Personal Blog. Crafted by Adithya.</p>
            </div>
        </footer>
    </div>
</body>

</html>
